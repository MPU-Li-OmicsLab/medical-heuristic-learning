[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medical-heuristic-learning"
version = "1.2.0"
description = "Medical Heuristic Learning"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = ["medical", "tabular", "heuristic", "rule-learning", "llm", "clinical"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.26",
    "openai>=2.37.0",
    "pandas>=2.0.3,<3.0.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "socksio>=1.0.0",
]

[project.urls]
repository = "https://github.com/MPU-Li-OmicsLab/medical-heuristic-learning"


[dependency-groups]
dev = [
    "lightgbm>=4.6.0",
    "torch>=2.3.0",
    "xgboost>=2.1.0",
    "deeptab==2.0.0",
    "interpret-core[aplr]==0.7.8",
    "aplr==10.23.0",
    "corels==1.1.29",
    "cython>=3.0,<4",
    "setuptools>=78.1.1,<80",
    "wheel>=0.46.0",
]
test = [
    "pytest>=8.0",
]

[tool.uv]
package = true
no-build-isolation-package = ["corels"]

[[tool.uv.dependency-metadata]]
name = "corels"
version = "1.1.29"
requires-dist = ["numpy"]

[tool.hatch.build.targets.wheel]
packages = ["src/hl"]

[tool.hatch.build.targets.sdist]
exclude = [
    "data/",
    "experiment/outputs_rerun/",
    "example_out*",
    "model_checkpoints/",
    ".venv/",
    ".uv-cache/",
    ".pytest_cache/",
    "dist/",
    "**/__pycache__/",
    "*.pyc",
]
